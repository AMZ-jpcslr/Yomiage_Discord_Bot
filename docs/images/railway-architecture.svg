<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc"><title id="title">Railwayの構成例</title><desc id="desc">Discordに接続するBotとVOICEVOX EngineをRailwayに配置。BotはVolumeへ設定を保存し、DeepL APIを利用して翻訳する。</desc><style>text {font-family: 'Yu Gothic','Meiryo',sans-serif;fill:#edf2ff} .muted {fill:#aebbd3} .accent {fill:#90adff} .green {fill:#75dfc1} .mono {font-family:Consolas,monospace}</style><rect width="1200" height="720" rx="24" fill="#101827"/><text x="44" y="54" font-size="18" class="accent">RAILWAY SETUP</text><text x="44" y="101" font-size="34" class="">Bot と音声エンジンを、同じ環境へ。</text><text x="44" y="140" font-size="18" class="muted">構成例  /  Railwayの管理画面ではありません。</text><rect x="330" y="181" width="830" height="420" rx="16" fill="#18263b"/><text x="358" y="219" font-size="22" class="accent">Railway  ·  同じプロジェクト / 環境</text><rect x="40" y="289" width="238" height="140" rx="16" fill="#1c2940"/><text x="68" y="337" font-size="29" class="">Discord</text><text x="68" y="378" font-size="20" class="muted">メッセージ / VC</text><rect x="371" y="270" width="310" height="178" rx="16" fill="#293c5b"/><text x="398" y="312" font-size="28" class="">Yomiage Bot</text><text x="398" y="350" font-size="19" class="muted">Node.js 22 + FFmpeg</text><text x="398" y="389" font-size="19" class="muted">翻訳ルール / 音声キュー</text><text x="398" y="425" font-size="18" class="green">レプリカ数：1</text><rect x="802" y="264" width="324" height="154" rx="16" fill="#1c2940"/><text x="827" y="305" font-size="25" class="">VOICEVOX Engine</text><text x="827" y="344" font-size="20" class="green">内部接続  :50021</text><text x="827" y="383" font-size="19" class="muted">テキスト → 音声データ</text><rect x="371" y="486" width="310" height="78" rx="16" fill="#1c2940"/><text x="398" y="519" font-size="23" class="green">Volume  /data</text><text x="398" y="547" font-size="17" class="muted">翻訳設定・音声設定を保存</text><rect x="802" y="486" width="324" height="78" rx="16" fill="#1c2940"/><text x="827" y="520" font-size="24" class="mono">/health</text><text x="827" y="548" font-size="18" class="muted">Discord接続完了 → 200</text><g fill="none" stroke="#8aabff" stroke-width="3"><path d="M278 353 H371 M359 345 L371 353 L359 361"/><path d="M681 337 H802 M790 329 L802 337 L790 345"/><path d="M526 448 V486"/></g><text x="692" y="317" font-size="18" class="muted">音声合成</text><text x="44" y="466" font-size="19" class="muted">宛先判定後、</text><text x="44" y="496" font-size="19" class="muted">対象本文をDeepLへ</text><rect x="40" y="623" width="1120" height="66" rx="16" fill="#1c2940"/><text x="66" y="665" font-size="24" class="">DeepL API（外部サービス）   →   訳文をDiscordの元投稿に返信</text><path d="M371 425 H310 V610 H526 V623 M518 615 L526 623 L534 615" stroke="#75dfc1" stroke-width="2" fill="none" stroke-dasharray="6 5"/></svg>