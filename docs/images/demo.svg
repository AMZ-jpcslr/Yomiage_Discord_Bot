<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc"><title id="title">読み上げと自動翻訳のデモ</title><desc id="desc">架空の会話。Alice宛ての日本語メンションにBotが英訳を返信。読み上げと翻訳の開始コマンドを表示。</desc><style>text {font-family: 'Yu Gothic','Meiryo',sans-serif;fill:#edf2ff} .muted {fill:#aebbd3} .accent {fill:#90adff} .green {fill:#75dfc1} .mono {font-family:Consolas,monospace}</style><rect width="1200" height="720" rx="24" fill="#101827"/><text x="44" y="54" font-size="18" class="accent">YOMIAGE DISCORD BOT</text><text x="44" y="102" font-size="34" class="">いつものチャットを、声と言葉でつなぐ。</text><text x="44" y="140" font-size="18" class="muted">説明用デモ  /  架空の会話・訳文です。Discordの実画面ではありません。</text><rect x="40" y="176" width="1120" height="340" rx="16" fill="#1c2940"/><text x="68" y="215" font-size="24" class=""># 交流</text><text x="920" y="213" font-size="18" class="green">翻訳先  EN-US</text><text x="76" y="263" font-size="20" class="accent">Yuki</text><text x="76" y="303" font-size="25" class="">@Alice 明日は何時に集まりますか？</text><path d="M85 326 V357 H108" stroke="#6e819e" stroke-width="2" fill="none"/><rect x="118" y="330" width="1008" height="156" rx="16" fill="#243451"/><text x="142" y="367" font-size="20" class="accent">Yomiage Bot   ·   元の投稿への返信</text><text x="142" y="407" font-size="21" class="green">EN-US / @Alice</text><text x="142" y="452" font-size="26" class="">@Alice What time shall we meet tomorrow?</text><rect x="40" y="538" width="544" height="134" rx="16" fill="#1c2940"/><text x="64" y="573" font-size="22" class="green">01  読み上げ</text><text x="64" y="610" font-size="23" class="mono">/voice_web join</text><text x="64" y="647" font-size="20" class="muted">実行したチャンネルの投稿 → 参加先VCへ</text><rect x="604" y="538" width="556" height="134" rx="16" fill="#1c2940"/><text x="628" y="573" font-size="22" class="accent">02  自動翻訳</text><text x="628" y="610" font-size="23" class="mono">/translate set</text><text x="628" y="647" font-size="20" class="muted">登録ユーザーへのメンション・返信 → 訳文</text></svg>